<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𓃥 白六光影傳說</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #dce0e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "STFangsong", "FangSong", "PMingLiU", sans-serif;
            color: #333;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* REC 錄影狀態指示器 */
        .rec-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 80;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            color: #fff;
            font-size: 0.85rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .rec-indicator.active {
            opacity: 1;
        }
        .rec-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }

        /* 介面 UI Toggle 按鈕 */
        .ui-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ui-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.05);
        }
        .ui-toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }
        .ui-toggle-btn.active svg {
            transform: rotate(180deg);
        }

        /* 控制面板 (預設收合) */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(28, 30, 38, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            padding-top: 60px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transform: scale(0.9) translateY(-20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 90;
            color: #e0e0e0;
        }
        .control-panel.open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: #ffffff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #6366f1;
            border-radius: 2px;
        }

        .control-group {
            margin-bottom: 16px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a0a5b5;
            margin-bottom: 6px;
        }
        .control-group label span.val {
            color: #818cf8;
            font-weight: 600;
            font-family: monospace;
        }

        textarea {
            width: 100%;
            height: 75px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #6366f1;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #a0a5b5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .action-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .share-btn {
            background: #4f46e5;
            color: white;
        }
        .share-btn:hover {
            background: #4338ca;
        }

        .rec-btn {
            background: #ef4444;
            color: white;
        }
        .rec-btn:hover {
            background: #dc2626;
        }
        .rec-btn.recording {
            background: #374151;
        }

        .toast-msg {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 120;
            white-space: nowrap;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hint {
            position: absolute;
            bottom: 24px;
            left: 24px;
            font-size: 0.85rem;
            color: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="rec-indicator" id="rec-indicator">
        <div class="rec-dot"></div>
        <span id="rec-timer">REC 00:00</span>
    </div>

    <button class="ui-toggle-btn" id="toggle-btn" title="設定選單">
        <svg viewBox="0 0 24 24">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
    </button>

    <div class="control-panel" id="control-panel">
        <div class="panel-title">𓃥 白六光影傳說</div>
        
        <div class="control-group">
            <label>多行輪播訊息 (每行一句)</label>
            <textarea id="text-input">早安親友們
祝您順心如意
光影藝術展</textarea>
        </div>

        <div class="control-group">
            <label>立體厚度 <span class="val" id="val-extrude">0.9</span></label>
            <input type="range" id="input-extrude" min="0.2" max="3" step="0.1" value="0.9">
        </div>

        <div class="control-group">
            <label>文字間距 <span class="val" id="val-spacing">9.0</span></label>
            <input type="range" id="input-spacing" min="4" max="20" step="0.5" value="9.0">
        </div>

        <div class="control-group">
            <label>光源高度 (Y) <span class="val" id="val-lighty">22.0</span></label>
            <input type="range" id="input-lighty" min="10" max="50" step="0.5" value="22.0">
        </div>

        <div class="control-group">
            <label>光源前後位置 (Z) <span class="val" id="val-lightz">-2.0</span></label>
            <input type="range" id="input-lightz" min="-30" max="30" step="0.5" value="-2.0">
        </div>

        <div class="control-group">
            <label>光源橫跨振幅 (X) <span class="val" id="val-lightx">35</span></label>
            <input type="range" id="input-lightx" min="15" max="60" step="1" value="35">
        </div>

        <div class="control-group">
            <label>光源移動速度 <span class="val" id="val-speed">1.0x</span></label>
            <input type="range" id="input-speed" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="toggle-row">
            <span>預覽自動橫跨動畫</span>
            <input type="checkbox" id="anim-toggle">
        </div>

        <div class="btn-group">
            <button class="action-btn share-btn" id="share-btn">
                <span>🔗 複製分享連結與設定</span>
            </button>
            <button class="action-btn rec-btn" id="rec-btn">
                <span>🔴 開始輪播錄影並存檔</span>
            </button>
        </div>
    </div>

    <div class="toast-msg" id="toast-msg">已複製分享連結與訊息設定！</div>

    <div class="hint">
        拖曳滑鼠可旋轉觀看角度<br>
        滾輪可縮放視角
    </div>

    <script>
        const container = document.getElementById('webgl-container');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdce0e6);
        scene.fog = new THREE.FogExp2(0xdce0e6, 0.005);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 65);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;

        // 材質
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0xe8e9ec,
            roughness: 0.25,
            metalness: 0.05
        });

        const textMaterial = new THREE.MeshStandardMaterial({
            color: 0x333540,
            roughness: 0.3,
            metalness: 0.2
        });

        // 地面
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(250, 250), floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(250, 100, 0xadb5bd, 0xcdd3da);
        grid.position.y = 0.01;
        scene.add(grid);

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 180;

        const shadowD = 50;
        dirLight.shadow.camera.left = -shadowD;
        dirLight.shadow.camera.right = shadowD;
        dirLight.shadow.camera.top = shadowD;
        dirLight.shadow.camera.bottom = -shadowD;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        const lightHelperMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.0, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffb703 })
        );
        scene.add(lightHelperMesh);

        // 輪播控制變數
        let lines = ["早安親友們", "祝您順心如意", "光影藝術展"];
        let currentLineIndex = 0;
        let animTime = 0;
        let lastLightX = -35;
        let isLooping = false;
        let totalTransitionsNeeded = 0;
        let transitionCount = 0;

        const textGroup = new THREE.Group();
        scene.add(textGroup);

        function createCharMeshGroup(char, extrudeDepth, isLightOnRight) {
            const size = 260;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, size, size);
            ctx.font = 'normal 160px "STFangsong", "FangSong", "STSong", "PMingLiU", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.translate(size / 2, size / 2);
            
            if (!isLightOnRight) {
                ctx.rotate(Math.PI / 2);
                ctx.scale(-1, 1);
            } else {
                ctx.rotate(Math.PI / 2);
                ctx.scale(1, 1);
            }

            ctx.scale(0.6, 1.0);

            ctx.fillStyle = '#ffffff';
            ctx.fillText(char, 0, 0);

            const imgData = ctx.getImageData(0, 0, size, size);
            const data = imgData.data;

            const group = new THREE.Group();
            const step = 2;
            const pixelSize = 0.08 * step;
            const boxGeo = new THREE.BoxGeometry(pixelSize, pixelSize, extrudeDepth);

            const scale = 9.5 / size;

            for (let y = 0; y < size; y += step) {
                for (let x = 0; x < size; x += step) {
                    const idx = (y * size + x) * 4 + 3;
                    if (data[idx] > 100) {
                        const m = new THREE.Mesh(boxGeo, textMaterial);
                        m.position.set(
                            (x - size / 2) * scale,
                            (size / 2 - y) * scale,
                            extrudeDepth / 2
                        );
                        m.castShadow = true;
                        m.receiveShadow = true;
                        group.add(m);
                    }
                }
            }

            return group;
        }

        function rebuildText(isLightOnRight = false) {
            while (textGroup.children.length > 0) {
                const child = textGroup.children[0];
                textGroup.remove(child);
            }

            const currentStr = lines[currentLineIndex] || "早安親友們";
            const extrudeDepth = parseFloat(document.getElementById('input-extrude').value);
            const spacing = parseFloat(document.getElementById('input-spacing').value);

            const chars = currentStr.split('');
            const totalLength = (chars.length - 1) * spacing;
            const startZ = -totalLength / 2;

            chars.forEach((char, index) => {
                const charMeshGroup = createCharMeshGroup(char, extrudeDepth, isLightOnRight);
                if (!charMeshGroup) return;

                const charAnchor = new THREE.Group();
                const posZ = startZ + index * spacing;
                
                charAnchor.position.set(0, 5, posZ);
                charMeshGroup.rotation.y = Math.PI / 2;

                charAnchor.add(charMeshGroup);
                textGroup.add(charAnchor);
            });

            updateURLHash();
        }

        function updateLinesFromInput() {
            const rawVal = document.getElementById('text-input').value;
            lines = rawVal.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            if (lines.length === 0) lines = ["早安親友們"];
            currentLineIndex = 0;
            rebuildText(lastLightX > 0);
        }

        // --- 優化：帶有全瀏覽器與多行訊息相容的 URL Hash 編解碼功能 ---
        function updateURLHash() {
            const config = {
                msg: encodeURIComponent(document.getElementById('text-input').value),
                e: document.getElementById('input-extrude').value,
                s: document.getElementById('input-spacing').value,
                ly: document.getElementById('input-lighty').value,
                lz: document.getElementById('input-lightz').value,
                lx: document.getElementById('input-lightx').value,
                spd: document.getElementById('input-speed').value
            };
            
            const hashParts = Object.keys(config).map(k => `${k}=${config[k]}`);
            window.location.hash = hashParts.join('&');
        }

        function loadFromURLHash() {
            if (!window.location.hash) return;
            try {
                const hashStr = window.location.hash.slice(1);
                const params = new URLSearchParams(hashStr);

                if (params.has('msg')) {
                    document.getElementById('text-input').value = decodeURIComponent(params.get('msg'));
                }
                if (params.has('e')) {
                    document.getElementById('input-extrude').value = params.get('e');
                    document.getElementById('val-extrude').textContent = params.get('e');
                }
                if (params.has('s')) {
                    document.getElementById('input-spacing').value = params.get('s');
                    document.getElementById('val-spacing').textContent = params.get('s');
                }
                if (params.has('ly')) {
                    document.getElementById('input-lighty').value = params.get('ly');
                    document.getElementById('val-lighty').textContent = params.get('ly');
                }
                if (params.has('lz')) {
                    document.getElementById('input-lightz').value = params.get('lz');
                    document.getElementById('val-lightz').textContent = params.get('lz');
                }
                if (params.has('lx')) {
                    document.getElementById('input-lightx').value = params.get('lx');
                    document.getElementById('val-lightx').textContent = params.get('lx');
                }
                if (params.has('spd')) {
                    document.getElementById('input-speed').value = params.get('spd');
                    document.getElementById('val-speed').textContent = `${params.get('spd')}x`;
                }
            } catch (e) {}
        }

        // --- 優化：全設備 (包含 iOS Safari) 100% 成功複製剪貼簿函數 ---
        function copyToClipboard(textToCopy) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(textToCopy);
            } else {
                return new Promise((resolve, reject) => {
                    const textArea = document.createElement('textarea');
                    textArea.value = textToCopy;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        textArea.remove();
                        resolve();
                    } catch (error) {
                        textArea.remove();
                        reject(error);
                    }
                });
            }
        }

        const shareBtn = document.getElementById('share-btn');
        const toastMsg = document.getElementById('toast-msg');

        shareBtn.addEventListener('click', () => {
            updateURLHash();
            const shareUrl = window.location.href;
            copyToClipboard(shareUrl).then(() => {
                toastMsg.classList.add('show');
                setTimeout(() => toastMsg.classList.remove('show'), 2500);
            }).catch(() => {
                alert('複製失敗，請手動複製網址列的連結');
            });
        });

        // --- 錄影核心邏輯 ---
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recStartTime = 0;
        let recTimerInterval = null;

        const recBtn = document.getElementById('rec-btn');
        const recIndicator = document.getElementById('rec-indicator');
        const recTimer = document.getElementById('rec-timer');

        function startRecordingCycle() {
            if (isRecording) {
                stopRecording();
                return;
            }

            // 重設輪播起點
            currentLineIndex = 0;
            animTime = 0;
            lastLightX = -parseFloat(document.getElementById('input-lightx').value);
            transitionCount = 0;
            totalTransitionsNeeded = lines.length;

            rebuildText(false);
            isLooping = true;

            // 開始 Canvas 錄影
            recordedChunks = [];
            const stream = renderer.domElement.captureStream(60);

            const options = { mimeType: 'video/webm;codecs=vp9' };
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = saveVideo;

            mediaRecorder.start();
            isRecording = true;
            recStartTime = Date.now();

            recBtn.classList.add('recording');
            recBtn.querySelector('span').textContent = '⏹ 停止錄影';
            recIndicator.classList.add('active');

            recTimerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                recTimer.textContent = `REC ${mins}:${secs}`;
            }, 1000);
        }

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
            isRecording = false;
            isLooping = false;

            recBtn.classList.remove('recording');
            recBtn.querySelector('span').textContent = '🔴 開始輪播錄影並存檔';
            recIndicator.classList.remove('active');
            clearInterval(recTimerInterval);
        }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `𓃥白六光影傳說_${new Date().toISOString().slice(0,10)}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        recBtn.addEventListener('click', startRecordingCycle);

        // 面板與控鍵事件
        const toggleBtn = document.getElementById('toggle-btn');
        const controlPanel = document.getElementById('control-panel');

        toggleBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('open');
            toggleBtn.classList.toggle('active');
        });

        document.getElementById('text-input').addEventListener('input', updateLinesFromInput);
        document.getElementById('input-extrude').addEventListener('input', (e) => {
            document.getElementById('val-extrude').textContent = e.target.value;
            rebuildText(lastLightX > 0);
        });
        document.getElementById('input-spacing').addEventListener('input', (e) => {
            document.getElementById('val-spacing').textContent = e.target.value;
            rebuildText(lastLightX > 0);
        });
        document.getElementById('input-lighty').addEventListener('input', (e) => {
            document.getElementById('val-lighty').textContent = e.target.value;
            updateURLHash();
        });
        document.getElementById('input-lightz').addEventListener('input', (e) => {
            document.getElementById('val-lightz').textContent = e.target.value;
            updateURLHash();
        });
        document.getElementById('input-lightx').addEventListener('input', (e) => {
            document.getElementById('val-lightx').textContent = e.target.value;
            updateURLHash();
        });
        document.getElementById('input-speed').addEventListener('input', (e) => {
            document.getElementById('val-speed').textContent = `${e.target.value}x`;
            updateURLHash();
        });

        loadFromURLHash();
        updateLinesFromInput();

        // 動畫渲染循環
        function animate() {
            requestAnimationFrame(animate);

            const isPreviewAnim = document.getElementById('anim-toggle').checked;
            const amplitude = parseFloat(document.getElementById('input-lightx').value);
            const ly = parseFloat(document.getElementById('input-lighty').value);
            const lz = parseFloat(document.getElementById('input-lightz').value);
            const speedMultiplier = parseFloat(document.getElementById('input-speed').value);

            let lx = lastLightX;

            if (isLooping || isPreviewAnim) {
                animTime += 0.012 * speedMultiplier;
                lx = -Math.cos(animTime) * amplitude;

                if ((lastLightX < 0 && lx >= 0) || (lastLightX > 0 && lx <= 0)) {
                    currentLineIndex = (currentLineIndex + 1) % lines.length;
                    rebuildText(lx > 0);

                    if (isRecording) {
                        transitionCount++;
                        if (transitionCount >= totalTransitionsNeeded) {
                            stopRecording();
                        }
                    }
                }
            }

            lastLightX = lx;

            dirLight.position.set(lx, ly, lz);
            dirLight.target.position.set(-lx * 0.5, 0, 0);
            dirLight.target.updateMatrixWorld();

            lightHelperMesh.position.set(lx, ly, lz);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
